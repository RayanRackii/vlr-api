# Fly.io config for rolvix-api-prod. No secrets here: they live in Fly secrets.
# Run from the vlr-api root, e.g.: flyctl deploy -a rolvix-api-prod -c deploy/fly.prod.toml ...
# Machine count is managed in Fly, not in this file.
app = "rolvix-api-prod"
primary_region = "gru"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
